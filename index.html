<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIC · Assistant virtuel SIREXE</title>
<style>
:root{--bg:#0f1115;--panel:#14171dcc;--line:#2a2f3a;--text:#e9ebf0;--muted:#8b92a0;--red:#d92323;--amber:#ffa31a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* Hero : le globe */
#orb{position:relative;flex:none;height:clamp(240px,46vh,520px);background:radial-gradient(ellipse at 50% 55%,#1b0d10 0,var(--bg) 70%)}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block}
.brand{position:absolute;top:18px;left:24px;z-index:2}
.brand h1{font-size:1.15rem;font-weight:700}
.brand h1 span{color:var(--red)}
.brand p{font-size:.8rem;color:var(--muted);margin-top:3px}
#status{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:.82rem;color:var(--muted);transition:color .4s;z-index:2}
#orb.thinking #status{color:var(--amber)}
#orb.speaking #status{color:#ff6b6b}

/* Chat */
.panel{flex:1;min-height:0;width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;backdrop-filter:blur(8px)}
#chat{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;max-width:90%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{flex:none;width:30px;height:30px;border-radius:8px;background:var(--red);color:#fff;font-size:.64rem;font-weight:800;display:grid;place-items:center}
.bubble{padding:11px 15px;border-radius:14px;line-height:1.55;font-size:.94rem;white-space:pre-wrap;word-wrap:break-word}
.msg.ai .bubble{background:#1b1f27;border:1px solid var(--line);border-top-left-radius:4px}
.msg.user .bubble{background:#2a1214;border:1px solid #5a1c1f;border-top-right-radius:4px}
.msg.err .bubble{border-color:var(--red);color:#ffb3b3}
.dots span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--amber);animation:b .9s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.2}}

#starters{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 10px}
#starters button{background:transparent;border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:999px;font-size:.83rem;cursor:pointer;transition:.2s}
#starters button:hover:not(:disabled){border-color:var(--red);background:#d923231a}
#starters button:disabled{opacity:.4;cursor:not-allowed}
.composer{display:flex;gap:10px;padding:12px 20px 18px;border-top:1px solid var(--line)}
#input{flex:1;background:#1b1f27;border:1px solid var(--line);color:var(--text);padding:13px 16px;border-radius:12px;font-size:.95rem;outline:none}
#input:focus{border-color:var(--red)}
#send{background:var(--red);color:#fff;border:0;padding:0 24px;border-radius:12px;font-weight:700;font-size:.95rem;cursor:pointer}
#send:hover:not(:disabled){filter:brightness(1.15)}
#send:disabled{background:#4a2224;color:#9a8a8a;cursor:not-allowed}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (max-width:560px){#orb{height:34vh}.brand{left:16px}#chat{padding:14px}#starters,.composer{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<section id="orb" class="idle" aria-label="Assistant AIC">
  <canvas id="globe" aria-hidden="true"></canvas>
  <div class="brand"><h1><span>AIC</span> · Application Industrielle de Caoutchouc</h1><p>Assistant virtuel du stand · SIREXE</p></div>
  <div id="status">En attente de votre question</div>
</section>

<div class="panel">
  <main id="chat" aria-live="polite"></main>
  <div id="starters">
    <button type="button">Vulcanisation sur site ?</button>
    <button type="button">Bandes transporteuses</button>
    <button type="button">Garnissage caoutchouc / PVC</button>
    <button type="button">Demander un devis</button>
  </div>
  <div class="composer">
    <input id="input" type="text" placeholder="Posez votre question à AIC…" autocomplete="off" aria-label="Votre message">
    <button id="send" type="button">Envoyer</button>
  </div>
</div>

<script>
/* ---------- Globe holographique (canvas) ---------- */
const orbEl = document.getElementById("orb"), statusEl = document.getElementById("status");
const cv = document.getElementById("globe"), ctx = cv.getContext("2d");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const STATUS = {idle:"En attente de votre question", thinking:"AIC réfléchit…", speaking:"AIC vous répond"};
// dot = couleur des points, line = couleur du maillage, speed = rotation, glow = halo, amp = pulsation
const TARGETS = {
  idle:    {dr:217,dg:35, db:35, lr:70, lg:120,lb:255,speed:.18,glow:.22,amp:0},
  thinking:{dr:255,dg:163,db:26, lr:255,lg:190,lb:80, speed:.9, glow:.45,amp:0},
  speaking:{dr:255,dg:60, db:60, lr:255,lg:110,lb:110,speed:.45,glow:.7, amp:1}
};
let state = "idle", cur = {...TARGETS.idle}, W, H, R, waves = [], lastWave = 0, rot = 0;

function setOrbState(s){
  state = s;
  orbEl.classList.remove("idle","thinking","speaking");
  orbEl.classList.add(s);
  statusEl.textContent = STATUS[s] || "";
}

function resize(){
  const d = Math.min(devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0);
  R = Math.min(W*.42, H*.42);
}
addEventListener("resize", resize); resize();

const N = 700, PTS = [], GA = Math.PI*(3-Math.sqrt(5));
for(let i=0;i<N;i++){const y=1-2*(i+.5)/N, r=Math.sqrt(1-y*y), t=i*GA;PTS.push([Math.cos(t)*r,y,Math.sin(t)*r]);}
const TILT = .38, cT = Math.cos(TILT), sT = Math.sin(TILT);
function proj(x,y,z,a,cx,cy,rad){
  const x1 = x*Math.cos(a)+z*Math.sin(a), z1 = -x*Math.sin(a)+z*Math.cos(a);
  const y2 = y*cT - z1*sT, z2 = y*sT + z1*cT;
  return [cx+x1*rad, cy-y2*rad, z2];
}
const rgb = (r,g,b,a) => `rgba(${r|0},${g|0},${b|0},${a})`;

function frame(ts){
  const t = ts/1000, k = TARGETS[state];
  for(const key in k) cur[key] += (k[key]-cur[key])*.05;
  rot += cur.speed*.016*(REDUCED?.2:1);
  ctx.clearRect(0,0,W,H);
  const cx = W/2, cy = H/2;
  const flick = state==="thinking" ? .78+.22*Math.sin(t*20) : 1;
  const rad = R*(1 + (REDUCED?0:cur.amp*.03*Math.sin(t*8)));
  ctx.globalAlpha = flick;

  // halo
  let g = ctx.createRadialGradient(cx,cy,rad*.6,cx,cy,rad*2);
  g.addColorStop(0, rgb(cur.dr,cur.dg,cur.db,cur.glow)); g.addColorStop(1, rgb(cur.dr,cur.dg,cur.db,0));
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // anneaux orbitaux + satellite
  for(const [rx,rot2,sp] of [[1.55,-.35,.7],[1.85,.5,-.45]]){
    ctx.strokeStyle = rgb(cur.lr,cur.lg,cur.lb,.28); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(cx,cy,rad*rx,rad*rx*.24,rot2,0,Math.PI*2); ctx.stroke();
    const a = t*sp*(1+cur.speed), ex = Math.cos(a)*rad*rx, ey = Math.sin(a)*rad*rx*.24;
    const px = cx+ex*Math.cos(rot2)-ey*Math.sin(rot2), py = cy+ex*Math.sin(rot2)+ey*Math.cos(rot2);
    ctx.fillStyle = rgb(cur.dr,cur.dg,cur.db,.95); ctx.beginPath(); ctx.arc(px,py,3,0,7); ctx.fill();
  }

  // corps sombre de la sphère
  g = ctx.createRadialGradient(cx-rad*.3,cy-rad*.35,rad*.1,cx,cy,rad);
  g.addColorStop(0, rgb(cur.dr*.25,cur.dg*.25,cur.db*.3,.55)); g.addColorStop(1, "rgba(8,9,12,.85)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = rgb(cur.lr,cur.lg,cur.lb,.55); ctx.lineWidth = 1.5; ctx.stroke();

  // maillage : parallèles + méridiens
  const front = new Path2D(), back = new Path2D();
  const seg = (arr) => {
    for(let i=1;i<arr.length;i++){
      const p=arr[i-1], q=arr[i], path=(p[2]+q[2])>0?front:back;
      path.moveTo(p[0],p[1]); path.lineTo(q[0],q[1]);
    }
  };
  for(let lat=-60; lat<=60; lat+=30){
    const la=lat*Math.PI/180, arr=[];
    for(let i=0;i<=64;i++){const lo=i/64*Math.PI*2; arr.push(proj(Math.cos(la)*Math.cos(lo),Math.sin(la),Math.cos(la)*Math.sin(lo),rot,cx,cy,rad));}
    seg(arr);
  }
  for(let m=0;m<12;m++){
    const lo=m/12*Math.PI*2, arr=[];
    for(let i=0;i<=48;i++){const la=-Math.PI/2+i/48*Math.PI; arr.push(proj(Math.cos(la)*Math.cos(lo),Math.sin(la),Math.cos(la)*Math.sin(lo),rot,cx,cy,rad));}
    seg(arr);
  }
  ctx.lineWidth = 1;
  ctx.strokeStyle = rgb(cur.lr,cur.lg,cur.lb,.07); ctx.stroke(back);
  ctx.strokeStyle = rgb(cur.lr,cur.lg,cur.lb,.38); ctx.stroke(front);

  // points
  for(const p of PTS){
    const [x,y,z] = proj(p[0],p[1],p[2],rot,cx,cy,rad);
    ctx.fillStyle = rgb(cur.dr,cur.dg,cur.db, z>0 ? .35+.6*z : .1);
    const s = z>0 ? 1.1+1.2*z : .7;
    ctx.fillRect(x-s/2,y-s/2,s,s);
  }

  // ligne de balayage
  const sy = Math.sin(t*(.6+cur.speed*1.8)), sw = Math.sqrt(1-sy*sy)*rad;
  ctx.strokeStyle = rgb(cur.dr,cur.dg,cur.db,.7); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(cx,cy-sy*rad*cT,sw,sw*sT,0,0,Math.PI*2); ctx.stroke();

  // ondes d'énergie (réponse)
  if(state==="speaking" && !REDUCED && ts-lastWave>650){waves.push(ts);lastWave=ts;}
  waves = waves.filter(w => ts-w<1800);
  for(const w of waves){
    const a = (ts-w)/1800;
    ctx.strokeStyle = rgb(255,70,70,(1-a)*.6); ctx.lineWidth = 2.5*(1-a)+.5;
    ctx.beginPath(); ctx.arc(cx,cy,rad*(1.02+a*.9),0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Chat ---------- */
const chat = document.getElementById("chat"), input = document.getElementById("input"),
      sendBtn = document.getElementById("send"), starterBtns = document.querySelectorAll("#starters button");
const history = []; // {role:"user"|"model", text}
let busy = false;

function addMessage(role, text, extra=""){
  const wrap = document.createElement("div");
  wrap.className = `msg ${role} ${extra}`;
  if(role==="ai"){const av=document.createElement("div");av.className="avatar";av.textContent="AIC";wrap.appendChild(av);}
  const b = document.createElement("div"); b.className="bubble"; b.textContent=text;
  wrap.appendChild(b); chat.appendChild(wrap); chat.scrollTop = chat.scrollHeight;
  return b;
}
function setBusy(v){
  busy=v; sendBtn.disabled=v; input.disabled=v; starterBtns.forEach(b=>b.disabled=v);
  if(!v) input.focus();
}
async function typewrite(el, text){
  for(let i=0;i<text.length;i+=2){el.textContent=text.slice(0,i+2);chat.scrollTop=chat.scrollHeight;await new Promise(r=>setTimeout(r,14));}
  el.textContent = text;
}
async function askServer(){
  const res = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({messages:history})});
  const data = await res.json().catch(()=>({}));
  if(!res.ok || !data.reply) throw new Error(data.error || `Erreur ${res.status}`);
  return data.reply;
}
async function sendMessage(text){
  text = (text||"").trim();
  if(!text || busy) return;
  setBusy(true); input.value="";
  addMessage("user", text); history.push({role:"user", text});
  setOrbState("thinking");
  const bubble = addMessage("ai","");
  bubble.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  try{
    const answer = await askServer();
    history.push({role:"model", text:answer});
    setOrbState("speaking");
    bubble.textContent = "";
    await typewrite(bubble, answer);
  }catch(err){
    history.pop();
    bubble.parentElement.classList.add("err");
    bubble.textContent = "Service momentanément indisponible. Un ingénieur sur le stand se fera un plaisir de vous répondre directement.";
    console.error(err);
  }finally{
    setOrbState("idle"); setBusy(false);
  }
}
sendBtn.addEventListener("click", ()=>sendMessage(input.value));
input.addEventListener("keydown", e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage(input.value);}});
starterBtns.forEach(b=>b.addEventListener("click", ()=>sendMessage(b.textContent)));

addMessage("ai","Bienvenue sur le stand AIC au SIREXE ! Bandes transporteuses, garnissage caoutchouc/PVC, rouleaux, joints, vulcanisation sur site : comment pouvons-nous vous aider ?");
setOrbState("idle");
</script>
</body>
</html>
